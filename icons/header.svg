<svg width="100%" height="190px" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Dark Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#020617;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="190" fill="url(#darkGrad)" />

  <!-- Wave -->
  <path fill="rgba(56,189,248,0.14)" filter="url(#glow)">
    <animate attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
      M0,120 C250,170 950,60 1200,120 L1200,190 L0,190 Z;
      M0,140 C250,80 950,180 1200,140 L1200,190 L0,190 Z;
      M0,120 C250,170 950,60 1200,120 L1200,190 L0,190 Z
      " />
  </path>

  <!-- Subtle Wave -->
  <path fill="rgba(147,197,253,0.07)">
    <animate attributeName="d"
      dur="12s"
      repeatCount="indefinite"
      values="
      M0,100 C300,150 900,60 1200,100 L1200,190 L0,190 Z;
      M0,115 C300,70 900,160 1200,115 L1200,190 L0,190 Z;
      M0,100 C300,150 900,60 1200,100 L1200,190 L0,190 Z
      " />
  </path>

  <!-- Greeting -->
  <text x="50%" y="60" text-anchor="middle"
        fill="#94a3b8"
        font-size="20"
        font-family="Verdana"
        opacity="0.95">
    Hey 👋 What's up?
  </text>

  <!-- Main Title -->
  <text x="50%" y="120" text-anchor="middle"
        fill="#e2e8f0"
        font-size="44"
        font-family="Verdana"
        filter="url(#glow)">
    Welcome to my GitHub
  </text>

</svg>
