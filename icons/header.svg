<svg width="100%" height="220px" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Dark Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#020617;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#darkGrad)" />

  <!-- Wave -->
  <path fill="rgba(56,189,248,0.15)" filter="url(#glow)">
    <animate attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
      M0,140 C250,200 950,80 1200,140 L1200,220 L0,220 Z;
      M0,160 C250,100 950,210 1200,160 L1200,220 L0,220 Z;
      M0,140 C250,200 950,80 1200,140 L1200,220 L0,220 Z
      " />
  </path>

  <!-- Subtle Wave -->
  <path fill="rgba(147,197,253,0.08)">
    <animate attributeName="d"
      dur="12s"
      repeatCount="indefinite"
      values="
      M0,120 C300,170 900,70 1200,120 L1200,220 L0,220 Z;
      M0,130 C300,80 900,180 1200,130 L1200,220 L0,220 Z;
      M0,120 C300,170 900,70 1200,120 L1200,220 L0,220 Z
      " />
  </path>

  <!-- Greeting -->
  <text x="50%" y="70" text-anchor="middle"
        fill="#94a3b8"
        font-size="22"
        font-family="Verdana"
        opacity="0.95">
    Hey 👋 What's up?
  </text>

  <!-- Main Title -->
  <text x="50%" y="135" text-anchor="middle"
        fill="#e2e8f0"
        font-size="48"
        font-family="Verdana"
        filter="url(#glow)">
    Welcome to my GitHub
  </text>

</svg>
