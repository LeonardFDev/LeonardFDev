<svg width="100%" height="160px" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Dark Gradient -->
    <linearGradient id="darkGradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#020617;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="160" fill="url(#darkGradFooter)" />

  <!-- Wave -->
  <path fill="rgba(56,189,248,0.12)" filter="url(#glow)">
    <animate attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
      M0,60 C250,10 950,150 1200,60 L1200,160 L0,160 Z;
      M0,80 C250,140 950,20 1200,80 L1200,160 L0,160 Z;
      M0,60 C250,10 950,150 1200,60 L1200,160 L0,160 Z
      " />
  </path>

  <!-- Subtle wave -->
  <path fill="rgba(147,197,253,0.06)">
    <animate attributeName="d"
      dur="12s"
      repeatCount="indefinite"
      values="
      M0,70 C300,120 900,30 1200,70 L1200,160 L0,160 Z;
      M0,90 C300,40 900,130 1200,90 L1200,160 L0,160 Z;
      M0,70 C300,120 900,30 1200,70 L1200,160 L0,160 Z
      " />
  </path>

  <!-- Footer Text -->
  <text x="50%" y="85" text-anchor="middle"
        fill="#ffffff"
        font-size="26"
        font-family="Verdana"
        filter="url(#glow)">
    Thanks for stopping by. Here you can check out my projects.
  </text>

</svg>
